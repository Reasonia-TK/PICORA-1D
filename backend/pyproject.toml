[project]
name = "picora-1d"
version = "0.3.1"
description = "Standalone one-dimensional PIC-MCC plasma simulation"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "numba>=0.59,<0.67",
    "numpy>=1.26",
    "pydantic>=2.6",
    "scipy>=1.11",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["es_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
dist = [
    "pyinstaller>=6.22",
]
